name: CI for Pull Requests

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      go-code: ${{ steps.changes.outputs.go-code }}
      e2e-tests: ${{ steps.changes.outputs.e2e-tests }}
      helm-charts: ${{ steps.changes.outputs.helm-charts }}
      renovate-config: ${{ steps.changes.outputs.renovate-config }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          # 各カテゴリには、それを駆動する reusable workflow 自身と
          # オーケストレータ (このファイル) も含める。workflow を書き換えたのに
          # 当の CI が skip されると変更が無検証のまま main に入るため
          filters: |
            go-code:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - '.github/workflows/go-ci.yml'
              - '.github/workflows/ci-for-any-pr.yml'
            e2e-tests:
              - 'e2e/**'
              - 'compose.yml'
              - 'compose.dev.yml'
              - 'compose.ci.yml'
              - 'Dockerfile'
              - 'Dockerfile.e2e'
              - '.env.example'
              - 'config/**'
              - 'migrations/**'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/e2e-test.yml'
              - '.github/workflows/ci-for-any-pr.yml'
            helm-charts:
              - 'helm/**'
              - '.github/workflows/helm-ci.yml'
              - '.github/workflows/ci-for-any-pr.yml'
            renovate-config:
              - 'renovate.json'
              - '.github/workflows/ci-for-any-pr.yml'

  ci-go:
    needs: detect-changes
    if: needs.detect-changes.outputs.go-code == 'true'
    uses: ./.github/workflows/go-ci.yml
    with:
      working-directory: .
      component-name: cargohold
      timeout-minutes: 30

  e2e-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.e2e-tests == 'true'
    uses: ./.github/workflows/e2e-test.yml
    with:
      timeout-minutes: 30

  helm-ci:
    needs: detect-changes
    if: needs.detect-changes.outputs.helm-charts == 'true'
    uses: ./.github/workflows/helm-ci.yml
    with:
      helm-chart-path: helm/cargohold
      timeout-minutes: 10

  renovate-config-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: detect-changes
    if: needs.detect-changes.outputs.renovate-config == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # 引数でファイル名を渡すと global config として検証されてしまい、repo config
      # 固有の検証が緩くなる。カレントディレクトリの renovate.json を自動検出させる。
      # --strict は非推奨記法 (migration necessary) を warning ではなく失敗にする
      - name: Validate renovate config
        run: npx --yes --package renovate -c 'renovate-config-validator --strict'

  ci-summary:
    runs-on: ubuntu-latest
    needs: [detect-changes, ci-go, e2e-tests, helm-ci, renovate-config-ci]
    if: always()
    steps:
      - name: Check CI results
        run: |
          echo "=== CI Summary ==="
          echo "Change detection results:"
          echo "  go-code: ${{ needs.detect-changes.outputs.go-code }}"
          echo "  e2e-tests: ${{ needs.detect-changes.outputs.e2e-tests }}"
          echo "  helm-charts: ${{ needs.detect-changes.outputs.helm-charts }}"
          echo "  renovate-config: ${{ needs.detect-changes.outputs.renovate-config }}"
          echo ""
          echo "CI results:"
          if [ "${{ needs.detect-changes.outputs.go-code }}" == "true" ]; then
            echo "  go-ci: ${{ needs.ci-go.result }}"
          else
            echo "  go-ci: skipped (no changes)"
          fi
          if [ "${{ needs.detect-changes.outputs.e2e-tests }}" == "true" ]; then
            echo "  e2e-tests: ${{ needs.e2e-tests.result }}"
          else
            echo "  e2e-tests: skipped (no changes)"
          fi
          if [ "${{ needs.detect-changes.outputs.helm-charts }}" == "true" ]; then
            echo "  helm-ci: ${{ needs.helm-ci.result }}"
          else
            echo "  helm-ci: skipped (no changes)"
          fi
          if [ "${{ needs.detect-changes.outputs.renovate-config }}" == "true" ]; then
            echo "  renovate-config-ci: ${{ needs.renovate-config-ci.result }}"
          else
            echo "  renovate-config-ci: skipped (no changes)"
          fi

          if [ "${{ needs.detect-changes.result }}" == "failure" ] || \
             [ "${{ needs.ci-go.result }}" == "failure" ] || \
             [ "${{ needs.e2e-tests.result }}" == "failure" ] || \
             [ "${{ needs.helm-ci.result }}" == "failure" ] || \
             [ "${{ needs.renovate-config-ci.result }}" == "failure" ]; then
            echo ""
            echo "One or more CI jobs failed"
            exit 1
          fi

          echo ""
          echo "All CI jobs completed successfully"
